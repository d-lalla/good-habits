<!doctype html>
<!-- Source of social-preview.png (1280x640). Regenerate:
     chrome --headless --hide-scrollbars --window-size=1280,640 --screenshot=social-preview.png social-preview.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Good Habits social preview</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#F6F3EC}
  body{position:relative;font-family:"Nunito Sans",sans-serif;color:#2B332D}
  .sun{position:absolute;right:120px;top:70px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#E9C9A8 0 45%,transparent 72%)}
  .hills{position:absolute;left:0;bottom:0;width:1280px;height:200px}
  .text{position:absolute;left:96px;top:92px;width:640px}
  .brand{display:flex;align-items:center;gap:14px;font:700 18px "Nunito Sans";letter-spacing:.12em;text-transform:uppercase;color:#6F8F72}
  .brand svg{width:40px;height:40px}
  h1{font:600 104px/1 Fraunces,serif;color:#2F4134;margin:28px 0 22px;letter-spacing:-.01em}
  p{font-size:34px;line-height:1.3;color:#4F6B52;margin:0}
  .chips{display:flex;gap:10px;margin-top:30px}
  .chip{font:700 18px "Nunito Sans";padding:8px 16px;border-radius:999px;background:#FBF9F4;border:1.5px solid #E2DCCD;color:#4F6B52}
  .card{position:absolute;right:96px;top:150px;width:360px;padding:26px 28px;background:#FBF9F4;border:1.5px solid #E2DCCD;border-radius:24px;box-shadow:0 10px 30px rgba(47,65,52,.08)}
  .card h2{font:600 24px Fraunces,serif;color:#2F4134;margin:0 0 16px}
  .row{display:grid;grid-template-columns:92px 1fr auto;align-items:center;margin:12px 0;font-size:18px}
  .dots{display:flex;gap:7px}
  .d{width:20px;height:20px;border-radius:50%;background:#6F8F72}
  .o{background:none;box-shadow:inset 0 0 0 2.5px #B7C4B3}
  .r{background:#E3C9AE}
  .n{width:6px;height:6px;margin:7px;background:#D9D3C5}
  .v{font-weight:700;color:#4F6B52;width:54px;text-align:right}
</style>
</head>
<body>
  <div class="sun"></div>
  <div class="text">
    <div class="brand">
      <svg viewBox="0 0 64 64"><path d="M32 58V30" stroke="#4F6B52" stroke-width="5" stroke-linecap="round"/><path d="M32 36C12 34 4 18 6 4c16 0 28 12 26 32z" fill="#6F8F72"/><path d="M32 30c16 0 28-12 28-28-16-2-28 10-28 28z" fill="#9DB59C"/></svg>
      Agent Skill · open source
    </div>
    <h1>Good Habits</h1>
    <p>Habits that last,<br>without streak anxiety.</p>
    <div class="chips"><span class="chip">Claude Code</span><span class="chip">Claude apps</span><span class="chip">Codex</span><span class="chip">70+ agents</span></div>
  </div>
  <div class="card">
    <h2>This week</h2>
    <div class="row">Water<span class="dots"><i class="d"></i><i class="d"></i><i class="d"></i><i class="d o"></i><i class="d"></i><i class="d"></i><i class="d r"></i></span><span class="v">5 of 6</span></div>
    <div class="row">Reading<span class="dots"><i class="d"></i><i class="d"></i><i class="d o"></i><i class="d"></i><i class="d"></i><i class="d n"></i><i class="d n"></i></span><span class="v">4 of 5</span></div>
    <div class="row">Bedtime<span class="dots"><i class="d"></i><i class="d"></i><i class="d"></i><i class="d o"></i><i class="d"></i><i class="d o"></i><i class="d"></i></span><span class="v">5 of 7</span></div>
  </div>
  <svg class="hills" viewBox="0 0 1280 200" preserveAspectRatio="none">
    <path d="M0 90 C 200 40, 400 70, 600 55 S 960 10, 1280 60 V200 H0 Z" fill="#DCE6D6"/>
    <path d="M0 135 C 240 100, 450 140, 690 115 S 1060 100, 1280 125 V200 H0 Z" fill="#9DB59C" opacity=".75"/>
    <path d="M0 172 C 280 150, 560 180, 830 160 S 1150 155, 1280 166 V200 H0 Z" fill="#6F8F72"/>
  </svg>
</body>
</html>
